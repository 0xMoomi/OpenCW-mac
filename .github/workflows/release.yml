name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance
      attestations: write # store the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: ./build.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))

      - name: Package
        run: |
          $zip = "OpenCW-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          Get-FileHash dist/OpenCW.exe, $zip |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path -Leaf $_.Path) } |
            Set-Content SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/OpenCW.exe
            OpenCW-*.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes "OpenCW-$env:GITHUB_REF_NAME-windows-x64.zip" SHA256SUMS.txt
